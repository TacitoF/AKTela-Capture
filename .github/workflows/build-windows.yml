name: Gerar AKTela Capture Clean.exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'AKTelaCaptureV1/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependências
        run: dotnet restore AKTelaCaptureV1/AKTelaCapture.csproj

      - name: Gerar executável Windows x64
        run: dotnet publish AKTelaCaptureV1/AKTelaCapture.csproj -c Release -r win-x64 -o publish

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: AKTela-Capture-v1.1-Windows-x64
          path: publish/
          if-no-files-found: error
