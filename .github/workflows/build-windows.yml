name: Gerar AKTela Capture.exe

on:
  workflow_dispatch:
  push:
    branches: [ main, "codex/**" ]
    paths:
      - 'AKTelaCaptureV1/**'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'AKTelaCaptureV1/**'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Limpar artefatos antigos
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force publish -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force AKTelaCaptureV1/bin -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force AKTelaCaptureV1/obj -ErrorAction SilentlyContinue

      - name: Restaurar dependências
        run: dotnet restore AKTelaCaptureV1/AKTelaCapture.csproj

      - name: Gerar executável Windows x64
        run: dotnet publish AKTelaCaptureV1/AKTelaCapture.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Validar perfis H.264 e continuidade da captura
        run: dotnet run --project tests/AKTelaCapture.SmokeTests/AKTelaCapture.SmokeTests.csproj -c Release

      - name: Validar interface Windows e gerar capturas
        run: dotnet run --project tests/AKTelaCapture.UiTests/AKTelaCapture.UiTests.csproj -c Release

      - name: Publicar capturas da interface
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AKTela-Capture-UI
          path: ui-captures/*.png
          if-no-files-found: warn

      - name: Conferir executável
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Executável não encontrado' }
          if ($exe.Name -ne 'AKTela Capture.exe') { Rename-Item $exe.FullName 'AKTela Capture.exe' }
          Get-Item 'publish/AKTela Capture.exe' | Format-List Name,Length,LastWriteTime

      - name: Publicar artefato
        uses: actions/upload-artifact@v6
        with:
          name: AKTela-Capture-v2.3.0-Windows-x64
          path: publish/AKTela Capture.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: AKTela-Capture-v2.3.0-Windows-x64
          path: release
      - name: Publicar versão testada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cd release
          mv 'AKTela Capture.exe' AKTela-Capture.exe
          sha256sum AKTela-Capture.exe > SHA256SUMS.txt
          gh release create v2.3.0 AKTela-Capture.exe SHA256SUMS.txt --target "$COMMIT_SHA" --title 'AKTela Capture 2.3.0' --notes 'Nova interface, correções de áudio e negociação, fila de vídeo que preserva quadros dependentes. Windows x64, independente de instalação do .NET. O FFmpeg é baixado na primeira transmissão. Validado com testes de H.264 e interface Windows; captura real de desktop, GPU e sessão Discord requer teste no computador de destino.'
